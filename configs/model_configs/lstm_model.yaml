# LSTM Temporal Sequence Model Configuration
model:
  input_size: 64 # Dimensionality of per-frame landmark/movement features
  hidden_size: 128
  num_layers: 2
  bidirectional: true
  dropout: 0.3
  use_attention: true

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 50
  early_stopping_patience: 10
  lr_scheduler: "reduce_on_plateau"
  scheduler_patience: 5
