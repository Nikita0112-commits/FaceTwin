# Machine Learning Models Configuration
cv_folds: 5
stratified: true
scaling: "standard"

models:
  random_forest:
    n_estimators: [100, 200]
    max_depth: [null, 10, 20]
    min_samples_split: [2, 5]
    random_state: 42

  svm:
    C: [0.1, 1.0, 10.0]
    kernel: ["rbf", "linear"]
    gamma: ["scale", "auto"]
    probability: true
    random_state: 42

  xgboost:
    n_estimators: [100, 200]
    max_depth: [3, 6]
    learning_rate: [0.01, 0.1]
    subsample: [0.8, 1.0]
    random_state: 42
